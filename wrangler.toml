name = "kindnessmob"
compatibility_date = "2024-09-23"
pages_build_output_dir = "./dist"

# Production bindings (main branch)
# D1 and R2 bindings are set in CF Pages dashboard per environment.
# This file documents the binding names used in Function code.
#
# Binding name: DB          -> D1 database
# Binding name: SCREENSHOTS -> R2 bucket
#
# Production: DB=km-db-prod, SCREENSHOTS=km-screenshots-prod
# Preview/staging: DB=km-db-staging, SCREENSHOTS=km-screenshots-staging
# (Set via CF Pages dashboard > Settings > Bindings per environment)
